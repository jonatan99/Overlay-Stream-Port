<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zone Portuaire — V5 Responsive</title>
<style>
html,body {
  margin:0; width:100%; height:100%;
  background:transparent; overflow:hidden;
  font-family:Arial,sans-serif;
}
* { box-sizing:border-box; }

.wrap {
  width:100vw;
  padding:8px;
}

.overlay {
  width:100%;
  min-width:0;
  padding:14px 18px;
  border:4px solid #4a2a18;
  border-radius:18px;
  background:linear-gradient(180deg,rgba(34,27,24,.96),rgba(16,16,17,.96));
  box-shadow:inset 0 0 0 2px #a75b2d,0 4px 16px rgba(0,0,0,.35);
  color:#f4eadf;
}

.top {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
}

.title {
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:clamp(14px,2.3vw,24px);
  font-weight:900;
  letter-spacing:clamp(.5px,.15vw,2px);
  text-transform:uppercase;
}

.gear { color:#d36b2e; margin-right:8px; }

.percent {
  flex:none;
  min-width:72px;
  text-align:right;
  white-space:nowrap;
  font-size:clamp(25px,4vw,36px);
  font-weight:1000;
  line-height:1;
  color:#ff8a3d;
  text-shadow:0 2px 0 #54250d;
}

.track {
  width:100%;
  height:25px;
  margin-top:11px;
  border:3px solid #6d3c21;
  border-radius:8px;
  background:#11161b;
  overflow:hidden;
  box-shadow:inset 0 3px 7px rgba(0,0,0,.75);
}

.fill {
  height:100%;
  width:0%;
  background:linear-gradient(180deg,#ff9b45,#d95f20 55%,#b84413);
  box-shadow:inset 0 2px 0 rgba(255,225,180,.45),0 0 10px rgba(235,104,37,.4);
  transition:width .8s cubic-bezier(.2,.8,.2,1);
}
.fill:after {
  content:""; display:block; height:100%;
  background:repeating-linear-gradient(90deg,transparent 0 74px,rgba(83,34,12,.35) 74px 77px);
}

/* Mode très étroit, utile pour TikTok */
@media (max-width:600px) {
  .wrap { padding:5px; }
  .overlay { padding:10px 12px; border-radius:13px; }
  .title { font-size:14px; }
  .percent { min-width:58px; font-size:27px; }
  .track { height:20px; margin-top:8px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="overlay">
    <div class="top">
      <div class="title"><span class="gear">⚙</span>ZONE PORTUAIRE • FARM DES MATÉRIAUX</div>
      <div class="percent" id="percent">0%</div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
</div>

<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRBwmohmgEgp86xlAjT8vkUcSt_bgUQ-H-DBTfz-m955sKGWap73RYS7oJpaHW3dg/pub?gid=2145278017&single=true&output=csv';
const POLL_MS=3000;
const DOWN_CONFIRMATIONS=4;

const pctEl=document.getElementById('percent');
const fillEl=document.getElementById('fill');
let displayed=null, downCandidate=null, downCount=0, busy=false;

function splitCSVLine(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){
      if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q;
    } else if(c===','&&!q){out.push(cur);cur='';}
    else cur+=c;
  }
  out.push(cur); return out;
}

function parseProgress(v){
  if(v==null) return NaN;
  let s=String(v).replace(/\u00a0/g,'').replace(/\s/g,'').trim();
  if(!s) return NaN;
  if(s.endsWith('%')) {
    const n=parseFloat(s.slice(0,-1).replace(',','.'));
    return Number.isFinite(n)?n:NaN;
  }
  const n=parseFloat(s.replace(',','.'));
  if(!Number.isFinite(n)) return NaN;
  return n>=0&&n<=1?n*100:n;
}

function render(p){
  p=Math.max(0,Math.min(100,Math.round(p)));
  displayed=p;
  pctEl.textContent=p+'%';
  requestAnimationFrame(()=>fillEl.style.width=p+'%');
}

function acceptReading(p){
  p=Math.max(0,Math.min(100,Math.round(p)));
  if(displayed===null){render(p);return;}
  if(p===displayed){downCandidate=null;downCount=0;return;}
  if(p>displayed){downCandidate=null;downCount=0;render(p);return;}
  if(p===downCandidate) downCount++;
  else {downCandidate=p;downCount=1;}
  if(downCount>=DOWN_CONFIRMATIONS){
    const v=downCandidate;
    downCandidate=null; downCount=0; render(v);
  }
}

async function update(){
  if(busy)return;
  busy=true;
  const ctrl=new AbortController();
  const timeout=setTimeout(()=>ctrl.abort(),7000);
  try {
    const sep=CSV_URL.includes('?')?'&':'?';
    const r=await fetch(CSV_URL+sep+'_='+Date.now()+'&r='+Math.random(),{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache','Pragma':'no-cache'},
      signal:ctrl.signal
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text=await r.text();
    const rows=text.replace(/\r/g,'').split('\n').map(splitCSVLine);
    const p=parseProgress(rows[5]?.[1]);
    if(Number.isFinite(p)) acceptReading(p);
  } catch(e) {
    console.warn('Lecture Google Sheets ignorée',e);
  } finally {
    clearTimeout(timeout); busy=false;
  }
}

update();
setInterval(update,POLL_MS);
</script>
</body>
</html>
