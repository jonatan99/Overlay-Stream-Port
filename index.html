<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HardCagibi S2 — Scierie</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent!important;font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}.overlay{width:min(100%,1000px);padding:12px 16px 15px;background:linear-gradient(110deg,rgba(20,18,18,.94),rgba(40,27,20,.91));border:1px solid rgba(242,141,61,.68);border-radius:14px;box-shadow:0 5px 22px rgba(0,0,0,.38)}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:10px}.title{font-size:20px;font-weight:900;letter-spacing:1.2px;color:#ffb36e;text-shadow:0 1px 2px #000}.percent{font-size:25px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}.track{height:19px;background:#28211e;border:1px solid #65432e;border-radius:99px;overflow:hidden}.fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#a94716,#ed7b2e,#ffbd65);box-shadow:0 0 13px #f18b3a80;transition:width .8s ease}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:9px;color:#e6d1be;font-size:13px;font-weight:600}.foot span{white-space:nowrap}.status{color:#c3aa96}@media(max-width:560px){.title{font-size:15px}.percent{font-size:20px}.foot{font-size:10px}}
</style></head><body><div class="overlay"><div class="head"><div class="title">⚙️ HARD CAGIBI S2 · SCIERIE</div><div class="percent" id="percent">0 %</div></div><div class="track"><div class="fill" id="fill"></div></div><div class="foot"><span id="blocks">Farm : — / — blocs</span><span id="materials">— / — matériaux</span></div></div>
<script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vQtlSB6dMdgtX138NVE2d25A6s1UFQQSJkjyvQGn81LFoIEI7_H5KlsJJIDy57PRQ/pub?gid=422538643&single=true&output=csv';
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);rows.push(row);return rows}
function num(x){if(typeof x==='number')return x;let s=String(x??'').replace(/\u00a0/g,'').replace(/\s/g,'').replace('%','').replace(/[^\d,.-]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/,/g,'');else s=s.replace(',','.');return Number(s)||0}
function get(rows,r,c){return rows[r-1]?.[c-1]??''}
function fmt(x){return Math.round(x).toLocaleString('fr-FR')}
async function refresh(){try{const url=CSV+'&_='+Date.now();const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('CSV HTTP '+res.status);const rows=parseCSV(await res.text());let total=num(get(rows,8,2)),farmed=num(get(rows,7,2)),done=num(get(rows,9,2)),count=num(get(rows,10,2));let pRaw=String(get(rows,6,2)).trim();let p=num(pRaw);if(pRaw.includes('%'))p/=100;else if(p>1)p/=100;if(!Number.isFinite(p)||(!p&&total>0))p=total?farmed/total:0;if(!total&&!count)throw Error('Cellules STREAM introuvables');p=Math.max(0,Math.min(1,p));document.getElementById('percent').textContent=Math.round(p*100)+' %';document.getElementById('fill').style.width=(p*100)+'%';document.getElementById('blocks').textContent='Farm : '+fmt(farmed)+' / '+fmt(total)+' blocs';document.getElementById('materials').textContent=fmt(done)+' / '+fmt(count)+' matériaux';}catch(e){console.warn('Mise à jour de la progression impossible :',e)}}refresh();setInterval(refresh,15000);
</script></body></html>
